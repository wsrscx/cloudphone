[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cloudphone-server"
version = "0.1.0"
description = "ADB-attached Android remote gaming server"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.116.1",
  "uvicorn[standard]==0.35.0",
  "cryptography==46.0.3",
  "argon2-cffi==25.1.0",
]

[project.scripts]
cloudphone-server = "cloudphone.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["cloudphone*"]

[tool.setuptools.package-data]
cloudphone = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
