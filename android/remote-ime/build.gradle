plugins {
    id "com.android.application"
}

android {
    namespace "com.cloudphone.ime"
    compileSdk 34

    defaultConfig {
        applicationId "com.cloudphone.ime"
        minSdk 30
        targetSdk 34
        versionCode 1
        versionName "1.0.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }

    signingConfigs {
        release {
            if (rootProject.ext.cloudPhoneSigningReady) {
                storeFile rootProject.file(rootProject.ext.cloudPhoneSigning.getProperty("storeFile"))
                storePassword rootProject.ext.cloudPhoneSigning.getProperty("storePassword")
                keyAlias rootProject.ext.cloudPhoneSigning.getProperty("keyAlias")
                keyPassword rootProject.ext.cloudPhoneSigning.getProperty("keyPassword")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources false
            signingConfig signingConfigs.release
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }
}

dependencies {
    testImplementation "junit:junit:4.13.2"
    testImplementation "org.json:json:20240303"
}
